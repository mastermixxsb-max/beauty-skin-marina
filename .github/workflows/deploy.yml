name: Deploy to Netlify

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          python3 << EOF
          import os, zipfile, urllib.request, json
          
          token = os.environ["NETLIFY_AUTH_TOKEN"]
          site_id = os.environ["NETLIFY_SITE_ID"]
          
          # Kreiraj zip
          with zipfile.ZipFile("deploy.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in [".git", ".github"]]
                  for file in files:
                      filepath = os.path.join(root, file)
                      arcname = os.path.relpath(filepath, ".")
                      zf.write(filepath, arcname)
          
          print(f"Zip kreiran: {os.path.getsize('deploy.zip')} bytes")
          
          # Deploy
          with open("deploy.zip", "rb") as f:
              data = f.read()
          
          req = urllib.request.Request(
              f"https://api.netlify.com/api/v1/sites/{site_id}/deploys",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/zip"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())
              print(f"Deploy ID: {result['id']}, State: {result['state']}")
          EOF
